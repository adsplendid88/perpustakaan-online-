name: Keep InfinityFree Alive

on:
  schedule:
    # Jalan setiap 12 jam
    - cron: '0 0,12 * * *'
  
  # Bisa dijalankan manual
  workflow_dispatch:

jobs:
  ping-website:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Website Perpustakaan
        run: |
          echo "Mengecek website..."
          curl -L -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://perpustakaan-online.kesug.com || true
          echo "Selesai!" 
