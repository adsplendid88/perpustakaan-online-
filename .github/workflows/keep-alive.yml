name: Keep InfinityFree Alive

on:
  schedule:
    # Jalan setiap 12 jam (00:00 dan 12:00 UTC)
    - cron: '0 0,12 * * *'
  
  # Bisa dijalankan manual
  workflow_dispatch:

jobs:
  ping-website:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Website Perpustakaan
        run: |
          echo "🌐 Mengecek website perpustakaan..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://perpustakaan-online.kesug.com)
          echo "Status HTTP: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Website berhasil diakses!"
          else
            echo "⚠️ Website tidak bisa diakses (status: $RESPONSE)"
          fi 
